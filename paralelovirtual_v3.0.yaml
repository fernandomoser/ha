blueprint:
  name: Paralelo Virtual 3.0 
  description: >
    Cria um paralelo virtual entre um interruptor físico que controla
    a carga e uma ou mais teclas virtuais sem carga conectada.

    A tecla virtual controla a carga física e o estado da carga física
    é sincronizado com as teclas virtuais, com proteção contra
    realimentação e loops.

  domain: automation

  input:
    carga_principal:
      name: Interruptor da carga
      description: >
        Selecione o switch/light fisicamente ligado à lâmpada.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: false

    teclas_virtuais:
      name: Teclas virtuais
      description: >
        Selecione uma ou mais teclas sem carga física que funcionarão
        como interruptores paralelos.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true


variables:
  carga: !input carga_principal
  virtuais: !input teclas_virtuais


triggers:

  # ============================================================
  # CARGA FÍSICA
  # ============================================================

  - trigger: state
    entity_id: !input carga_principal
    from: "off"
    to: "on"
    id: carga_on

  - trigger: state
    entity_id: !input carga_principal
    from: "on"
    to: "off"
    id: carga_off


  # ============================================================
  # TECLAS VIRTUAIS
  # ============================================================

  - trigger: state
    entity_id: !input teclas_virtuais
    from: "off"
    to: "on"
    id: virtual_on

  - trigger: state
    entity_id: !input teclas_virtuais
    from: "on"
    to: "off"
    id: virtual_off


conditions: []


actions:

  - choose:

      # ========================================================
      # TECLA VIRTUAL FOI LIGADA
      #
      # Só aceitamos como comando quando a mudança não foi
      # provocada por outra automação/script.
      # ========================================================

      - conditions:
          - condition: trigger
            id: virtual_on

          - condition: template
            value_template: >
              {{ trigger.to_state.context.parent_id is none }}

        sequence:

          - if:
              - condition: template
                value_template: >
                  {{ states(carga) != 'on' }}

            then:
              - action: homeassistant.turn_on
                target:
                  entity_id: !input carga_principal


      # ========================================================
      # TECLA VIRTUAL FOI DESLIGADA
      # ========================================================

      - conditions:
          - condition: trigger
            id: virtual_off

          - condition: template
            value_template: >
              {{ trigger.to_state.context.parent_id is none }}

        sequence:

          - if:
              - condition: template
                value_template: >
                  {{ states(carga) != 'off' }}

            then:
              - action: homeassistant.turn_off
                target:
                  entity_id: !input carga_principal


      # ========================================================
      # CARGA FÍSICA FOI LIGADA
      #
      # Sincroniza as teclas virtuais.
      # ========================================================

      - conditions:
          - condition: trigger
            id: carga_on

        sequence:

          - repeat:
              for_each: "{{ virtuais }}"
              sequence:

                - if:
                    - condition: template
                      value_template: >
                        {{ states(repeat.item) != 'on' }}

                  then:
                    - action: homeassistant.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"


      # ========================================================
      # CARGA FÍSICA FOI DESLIGADA
      #
      # Sincroniza as teclas virtuais.
      # ========================================================

      - conditions:
          - condition: trigger
            id: carga_off

        sequence:

          - repeat:
              for_each: "{{ virtuais }}"
              sequence:

                - if:
                    - condition: template
                      value_template: >
                        {{ states(repeat.item) != 'off' }}

                  then:
                    - action: homeassistant.turn_off
                      target:
                        entity_id: "{{ repeat.item }}"


mode: queued
max: 10
max_exceeded: silent
