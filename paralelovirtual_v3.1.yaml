blueprint:
  name: Paralelo Virtual 3.1
  description: >
    Cria um paralelo virtual entre um interruptor físico que controla
    a carga e uma ou mais teclas virtuais sem carga conectada.

    As teclas virtuais controlam a carga física e o estado da carga
    física é sincronizado com as teclas virtuais.

    A proteção contra realimentação é feita verificando o estado
    atual antes de enviar qualquer comando.

  domain: automation

  input:

    carga_principal:
      name: Interruptor da carga
      description: >
        Selecione o switch/light fisicamente ligado à lâmpada.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: false

    teclas_virtuais:
      name: Teclas virtuais
      description: >
        Selecione uma ou mais teclas sem carga física que funcionarão
        como interruptores paralelos.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true


variables:
  carga: !input carga_principal
  virtuais: !input teclas_virtuais


triggers:

  # ============================================================
  # CARGA FÍSICA
  # ============================================================

  - trigger: state
    entity_id: !input carga_principal
    from: "off"
    to: "on"
    id: carga_on

  - trigger: state
    entity_id: !input carga_principal
    from: "on"
    to: "off"
    id: carga_off


  # ============================================================
  # TECLAS VIRTUAIS
  # ============================================================

  - trigger: state
    entity_id: !input teclas_virtuais
    from: "off"
    to: "on"
    id: virtual_on

  - trigger: state
    entity_id: !input teclas_virtuais
    from: "on"
    to: "off"
    id: virtual_off


conditions: []


actions:

  - choose:

      # ========================================================
      # TECLA VIRTUAL → LIGAR CARGA
      # ========================================================

      - conditions:
          - condition: trigger
            id: virtual_on

        sequence:

          - if:
              - condition: template
                value_template: >
                  {{ states(carga) != 'on' }}

            then:
              - action: homeassistant.turn_on
                target:
                  entity_id: !input carga_principal


      # ========================================================
      # TECLA VIRTUAL → DESLIGAR CARGA
      # ========================================================

      - conditions:
          - condition: trigger
            id: virtual_off

        sequence:

          - if:
              - condition: template
                value_template: >
                  {{ states(carga) != 'off' }}

            then:
              - action: homeassistant.turn_off
                target:
                  entity_id: !input carga_principal


      # ========================================================
      # CARGA LIGOU → SINCRONIZAR TECLAS VIRTUAIS
      # ========================================================

      - conditions:
          - condition: trigger
            id: carga_on

        sequence:

          - repeat:
              for_each: "{{ virtuais }}"
              sequence:

                - if:
                    - condition: template
                      value_template: >
                        {{ states(repeat.item) != 'on' }}

                  then:
                    - action: homeassistant.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"


      # ========================================================
      # CARGA DESLIGOU → SINCRONIZAR TECLAS VIRTUAIS
      # ========================================================

      - conditions:
          - condition: trigger
            id: carga_off

        sequence:

          - repeat:
              for_each: "{{ virtuais }}"
              sequence:

                - if:
                    - condition: template
                      value_template: >
                        {{ states(repeat.item) != 'off' }}

                  then:
                    - action: homeassistant.turn_off
                      target:
                        entity_id: "{{ repeat.item }}"


mode: queued
max: 10
max_exceeded: silent
